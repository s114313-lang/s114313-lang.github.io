<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定義旋轉轉盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <h1>🎡 自定義決策轉盤</h1>

        <div class="input-section">
            <p>請輸入選項（每行一個）：</p>
            <textarea id="optionInput" rows="5">
吃飯
看電影
打電動
運動
休息
洗碗</textarea>
            <button onclick="updateWheel()">更新轉盤內容</button>
        </div>

        <hr>

        <div class="wheel-outer">
            <div class="pointer"></div>
            <div id="wheel">
                <div id="labelsContainer"></div>
            </div>
        </div>

        <div class="action-section">
            <button id="spinBtn" onclick="spinWheel()">🚀 開始旋轉</button>
            <h2 id="resultText">準備好試試手氣了嗎？</h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
