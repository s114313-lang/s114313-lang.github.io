<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轉盤</title>
    <link rel="stylesheet" href="style.css"> 
  <link rel="icon" href="貓.png">


</head>
<body>
    <div class="container">
        <h1>轉盤</h1>
        
        <div class="input-area">
            <p>請輸入您的選項，每行一個項目：</p>
            <textarea id="optionInput" rows="5" cols="40">
吃飯
看電影
打電動
運動
休息
洗碗
            </textarea>
            <button id="updateOptionsButton">更新轉盤</button>
        </div>
        
        <hr> <div class="wheel-container">
            <div id="wheel">
                </div>
            <div class="pointer"></div>
        </div>
        
        <button id="spinButton" disabled>🚀 開始轉動</button>
        <p id="result">點擊「更新轉盤」開始設定。</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
